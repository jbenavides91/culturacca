<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="pwa-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  <!-- Background with squircle/rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#pwa-grad)" />
  
  <!-- Inner Subtle Accent Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Calendar / Sheet Base -->
  <rect x="120" y="128" width="272" height="264" rx="36" fill="#1E1B4B" stroke="#6366F1" stroke-width="12" />
  
  <!-- Top bar of sheet -->
  <path d="M 120 176 L 392 176" stroke="#4338CA" stroke-width="10" />
  
  <!-- Binder Rings -->
  <rect x="180" y="108" width="20" height="44" rx="10" fill="#E0E7FF" />
  <rect x="312" y="108" width="20" height="44" rx="10" fill="#E0E7FF" />

  <!-- Dynamic Attendance Verified Checkmark -->
  <circle cx="256" cy="276" r="64" fill="url(#pwa-accent)" />
  <path d="M 226 276 L 246 296 L 292 250" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Status Dots -->
  <circle cx="168" cy="336" r="10" fill="#34D399" />
  <circle cx="344" cy="336" r="10" fill="#818CF8" />
</svg>
